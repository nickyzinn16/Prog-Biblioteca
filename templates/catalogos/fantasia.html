<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <title>Fantasia - Biblioteca</title>
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Logo.png') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/catalogos/fantasia.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
        <script src="https://kit.fontawesome.com/35842701b4.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <header class="header">
            <nav class="navbar">
                <div class="logo">
                    <a href="{{ url_for('index') }}">
                        <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Logo">
                    </a>
                </div>
                <div class="menu">
                    <ul>
                        <li><a href="{{ url_for('index') }}" class="ativo">Início</a></li>
                        <li><a href="{{ url_for('carrinho') }}">Carrinho</a></li>
                        <li><a href="{{ url_for('favoritos') }}">Favoritos</a></li>
                        <li><a href="{{ url_for('promocoes') }}">Promoções</a></li>
                        <li><a href="{{ url_for('login') }}" class="btn-login">Login</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="pesquisar">
            <input type="text" placeholder="Procurar Livros">
            <button class="procurar">Procurar</button>
        </div>

        <div class="conteudo-catalogo">
            {% for livro in livros %}
            <div class="livro">
                <img src="{{ url_for('static', filename='images/fantasia.webp') }}" alt="{{ livro[1] }}">
                <div class="info">
                    <h2>{{ livro[1] }}</h2>
                    <p>{{ livro[2] }} | {{ livro[3] }} | {{ livro[4] }}</p>
                    <a href="{{ url_for('adicionar_favorito', id_livro=livro[0]) }}" class="btn-emprestar">
                        <i class="fa-solid fa-heart"></i> Adicionar aos Favoritos
                    </a>
                </div>
            </div>
            {% else %}
            <p>Nenhum livro disponível nesta categoria.</p>
            {% endfor %}
        </div>

    </body>
</html>
