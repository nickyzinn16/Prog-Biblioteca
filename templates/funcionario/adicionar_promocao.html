<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <title>Adicionar Promoção - Funcionário</title>
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Logo.png') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/funcionario/base.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/funcionario/menu.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/funcionario/form.css') }}">
        <script src="https://kit.fontawesome.com/35842701b4.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <aside class="sidebar">
            <div class="logo"><a href="{{ url_for('dashboard_funcionario') }}"><img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Logo"></a></div>
            <ul>
                <li><a href="{{ url_for('dashboard_funcionario') }}">Início</a></li>
                <li><a href="{{ url_for('func_livros') }}">Livros</a></li>
                <li><a href="{{ url_for('func_catalogos') }}">Catálogos</a></li>
                <li><a href="{{ url_for('func_promocoes') }}" class="ativo">Promoções</a></li>
                <li><a href="{{ url_for('func_perguntas') }}">Perguntas</a></li>
                <li><a href="{{ url_for('func_emprestimos') }}">Empréstimos</a></li>
                <li><a href="{{ url_for('func_compras') }}">Compras</a></li>
                <li><a href="{{ url_for('func_relatorios') }}">Relatórios</a></li>
            </ul>
            <div class="user-menu">
                <p>{{ session['nome'] }}</p>
                <a href="{{ url_for('logout') }}">Sair da conta</a>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="titulo">Adicionar Promoção</h1>
            <form action="{{ url_for('func_adicionar_promocao') }}" method="POST">
                <div class="campo">
                    <label>Livro</label>
                    <select name="id_livro" required>
                        <option value="">Seleciona um livro</option>
                        {% for livro in livros %}<option value="{{ livro[0] }}">{{ livro[1] }}</option>{% endfor %}
                    </select>
                </div>
                <div class="campo"><label>Preço Original (CVE)</label><input type="number" name="preco" placeholder="Ex: 2000" required></div>
                <div class="campo"><label>Desconto (%)</label><input type="number" name="desconto" placeholder="Ex: 20" min="1" max="100" required></div>
                <button type="submit" class="btn-adicionar">Guardar</button>
                <a href="{{ url_for('func_promocoes') }}">Cancelar</a>
            </form>
        </main>

        <button id="btn-topo">↑</button>
        <script src="{{ url_for('static', filename='javascript/botao.js') }}"></script>
    </body>
</html>
