<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <title>Editar Livro - Funcionário</title>
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Logo.png') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/funcionario/base.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/funcionario/menu.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/funcionario/form.css') }}">
        <script src="https://kit.fontawesome.com/35842701b4.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <aside class="sidebar">
            <div class="logo"><a href="{{ url_for('dashboard_funcionario') }}"><img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Logo"></a></div>
            <ul>
                <li><a href="{{ url_for('dashboard_funcionario') }}">Início</a></li>
                <li><a href="{{ url_for('func_livros') }}" class="ativo">Livros</a></li>
                <li><a href="{{ url_for('func_catalogos') }}">Catálogos</a></li>
                <li><a href="{{ url_for('func_promocoes') }}">Promoções</a></li>
                <li><a href="{{ url_for('func_perguntas') }}">Perguntas</a></li>
                <li><a href="{{ url_for('func_emprestimos') }}">Empréstimos</a></li>
                <li><a href="{{ url_for('func_compras') }}">Compras</a></li>
                <li><a href="{{ url_for('func_relatorios') }}">Relatórios</a></li>
                <li><a href="{{ url_for('func_utilizadores') }}">Utilizadores</a></li>
            </ul>
            <div class="user-menu">
                <p>{{ session['nome'] }}</p>
                <a href="{{ url_for('logout') }}">Sair da conta</a>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="titulo">Editar Livro</h1>
            <form action="{{ url_for('func_editar_livro', id=livro[0]) }}" method="POST">
                <div class="campo"><label>Título</label><input type="text" name="titulo" value="{{ livro[1] }}" required></div>
                <div class="campo"><label>Autor</label><input type="text" name="autor" value="{{ livro[2] }}" required></div>
                <div class="campo"><label>Editora</label><input type="text" name="editora" value="{{ livro[3] }}"></div>
                <div class="campo"><label>Ano de Publicação</label><input type="number" name="ano" value="{{ livro[4] }}"></div>
                <div class="campo">
                    <label>Categoria</label>
                    <select name="categoria">
                        {% for catalogo in catalogos %}
                        <option value="{{ catalogo[0] }}" {% if catalogo[0] == livro[5] %}selected{% endif %}>{{ catalogo[0]|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="campo"><label>Quantidade</label><input type="number" name="quantidade" value="{{ livro[6] }}" required></div>
                <div class="campo"><label>Preço (CVE)</label><input type="number" name="preco" value="{{ livro[9] }}" required></div>
                <button type="submit" class="btn-adicionar">Guardar</button>
                <a href="{{ url_for('func_livros') }}">Cancelar</a>
            </form>
        </main>

        <button id="btn-topo">↑</button>
        <script src="{{ url_for('static', filename='javascript/botao.js') }}"></script>
    </body>
</html>
